# Fixed texts — invariable across the entire liturgical year.
# Replace stub strings with a licensed translation before production use.

introductory_verse:
  opening: "[O God, come to our aid]"
  response: "[O Lord, make haste to help us]"
  gloria: |
    [Glory be to the Father, and to the Son, and to the Holy Spirit,
    as it was in the beginning, is now, and ever shall be, world without end. Amen.]

invitatory_verse:
  opening: "[Lord, open our lips.]"
  response: "[And our mouth shall proclaim your praise.]"

alleluia: "[Alleluia.]"

benedictus:
  reference: "Lk 1:68-79"
  text: "[Benedictus — full text]"

magnificat:
  reference: "Lk 1:46-55"
  text: "[Magnificat — full text]"

nunc_dimittis:
  reference: "Lk 2:29-32"
  text: "[Nunc Dimittis — full text]"

te_deum:
  text: "[Te Deum laudamus — full text]"
  optional_final_part: "[Lord, save your people…]"

lords_prayer: "[Our Father — full text]"

compline_responsory: |
  [℣. Into your hands, Lord, I commend my spirit.
  ℟. Into your hands, Lord, I commend my spirit.
  ℣. You have redeemed us, Lord God of truth.
  ℟. I commend my spirit.]

compline_blessing: "[℣. The Lord grant us a quiet night and a perfect end. ℟. Amen.]"

oor_acclamation: |
  [℣. Let us praise the Lord.
  ℟. Thanks be to God.]

dismissal_with_minister:
  verse: "[The Lord be with you.]"
  response: "[And with your spirit. Go in the peace of Christ. Thanks be to God.]"

dismissal_without_minister:
  verse: "[The Lord bless us, protect us from all evil, and bring us to everlasting life.]"
  response: "[Amen.]"

examination_of_conscience: "[Examination of conscience — optional]"

marian_antiphons:
  advent_through_feb2:
    text: "[Alma Redemptoris Mater]"
  lent:
    text: "[Ave Regina Caelorum]"
  eastertide:
    text: "[Regina Caeli, laetare]"
    suppress_alleluia: true
  ordinary_time:
    text: "[Salve Regina]"

