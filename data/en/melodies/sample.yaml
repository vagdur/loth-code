# Hand-authored placeholder melodies for the `en` bundle.
#
# The `en` tree is not an office anyone can pray — it is the fixture the test
# suite renders, and these melodies are here so the sung path (GABC → exsurge
# in HTML, → GregorioTeX in LaTeX) is exercised end to end. The notation is
# invented and the lyrics are placeholders, matching the bracketed stub text
# everywhere else under data/en/.
#
# A real locale gets this file from its own extraction pipeline, which also
# fills in `source`; these have none, being nobody's transcription.

- id: en/sample/introductory-verse
  kind: dialogue
  language: english
  parts:
    versicle: (c4) Sam(j)ple(j) ver(i)si(h)cle.(j)
