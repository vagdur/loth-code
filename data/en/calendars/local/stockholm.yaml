calendar_id: stockholm
extends: general

seasonal_observance:
  epiphany: fixed_jan_6
  corpus_christi: second_sunday_after_pentecost
  ascension: thursday

overrides:
  # Universal feast (23 Jul) → optional memoria of her heavenly birthday;
  # diocesan solemnity is 7 Oct (st_birgitta_patron).
  - id: st_birgitta
    name: Heavenly birthday of St. Birgitta
    rank: optional_memoria

additions:
  - id: st_henrik
    name: St. Henrik, bishop and martyr
    rank: obligatory_memoria
    calendar_position:
      type: fixed
      month: 1
      day: 19
    applicable_commons:
      - pastors

  - id: st_erik
    name: St. Erik, king and martyr
    rank: feast
    calendar_position:
      type: fixed
      month: 5
      day: 18
    applicable_commons:
      - martyrs

  - id: st_birgitta_patron
    name: St. Birgitta, patron of Sweden and Europe
    rank: solemnity
    calendar_position:
      type: fixed
      month: 10
      day: 7
    applicable_commons:
      - holy_men_women
