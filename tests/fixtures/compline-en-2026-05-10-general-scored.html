<script type="module">
import { renderScore } from "./lothChant.js";
for (const spec of JSON.parse(document.getElementById("loth-scores").textContent)) {
  // The selector is built rather than written out so that this script does not
  // itself read as a score mount to anything grepping the page for one.
  const el = document.querySelector('[data-score-id=' + JSON.stringify(spec.id) + ']');
  if (el) renderScore(el, spec);
}
</script>

<body>
<article class="loth-hour" data-hour="compline">
  <h1 class="loth-hour-heading">COMPLINE — NIGHT PRAYER - 10 May. Sixth Sunday of Eastertide.</h1>

  <div class="loth-score" data-loth-score data-score-id="compline-scored-score-1" data-gabc="name:compline-scored-score-1;&#10;%%&#10;(c4) &lt;sp&gt;V/&lt;/sp&gt;Sam(j)ple(j) ver(i)si(h)cle.(j) (::) (Z)&#10;&lt;sp&gt;R/&lt;/sp&gt;Sam(j)ple(j) re(i)sponse.(h) (::) (Z)&#10;&lt;sp&gt;V/&lt;/sp&gt;+&lt;sp&gt;R/&lt;/sp&gt;Sam(j)ple(j) do(i)xo(h)lo(j)gy,(j) (:) sam(h)ple(g) se(f)cond(g) half.(g) (::) A(gh)men.(g) (:) Al(j)le(k)lu(j)ia.(i) (::)" data-language="english" data-melody-id="en/sample/introductory-verse"></div>

  <p class="loth-melody-rubric">Mode 1</p>

  <div class="loth-score" data-loth-score data-score-id="compline-scored-score-2" data-gabc="name:compline-scored-score-2;&#10;%%&#10;(c4) Sam(f)ple(g) hymn(h) for(g) the(f) sam(g)ple(f) day,(f) (;) sung(g) to(h) a(g) sam(f)ple(g) tune.(f) (::) A(fg)men.(f)" data-language="english" data-melody-id="en/sample/hymn"></div>

  <p class="loth-melody-rubric">Mode 1</p>

  <div class="loth-score" data-loth-score data-score-id="compline-scored-score-3" data-gabc="name:compline-scored-score-3;&#10;%%&#10;(c4) Sam(f)ple(f) an(g)ti(f)phon(e) two.(f)" data-language="english" data-melody-id="en/sample/antiphon-2"></div>

  <p class="loth-psalm-tone-label">Psalm tone</p>
  <div class="loth-score loth-psalm-tone" data-loth-score data-score-id="compline-scored-score-4" data-gabc="name:compline-scored-score-4;&#10;%%&#10;(c4) (f) (g) (hr0) (g) (f) (gr1R) (:) (fr0) (e) (d) (er1R)" data-language="english" data-melody-id="en/sample/antiphon-2"></div>

  <p class="loth-melody-rubric">Mode 6</p>

  <div class="loth-score" data-loth-score data-score-id="compline-scored-score-5" data-gabc="name:compline-scored-score-5;&#10;%%&#10;(c4) &lt;sp&gt;R/&lt;/sp&gt;Sam(f)ple(f) short(g) re(f)spon(e)so(f)ry.(f) +(:) Sam(f)ple(f) sec(g)ond(f) half.(f) (::) (Z)&#10;&lt;sp&gt;V/&lt;/sp&gt;Sam(f)ple(g) ver(f)si(e)cle(f) line.(f) (::) + Sam(f)ple(f) sec(g)ond(f) half.(f) (::) (Z)&#10;&lt;sp&gt;V/&lt;/sp&gt;Sam(f)ple(g) do(f)xo(e)lo(f)gy.(f) (::) &lt;sp&gt;R/&lt;/sp&gt;Sam(f)ple(f) short(g) re(f)spon(e)so(f)ry.(f) +(:) Sam(f)ple(f) sec(g)ond(f) half.(f) (::)" data-language="english" data-melody-id="en/sample/short-responsory"></div>

  <h2 class="loth-section-heading">NUNC DIMITTIS</h2>

  <p class="loth-melody-rubric">Mode 7</p>

  <div class="loth-score" data-loth-score data-score-id="compline-scored-score-6" data-gabc="name:compline-scored-score-6;&#10;%%&#10;(c3) Sam(e)ple(e) gos(g)pel(h) can(i_)ti(g)cle(f) an(h)ti(g)phon.(g)" data-language="english" data-melody-id="en/sample/gospel-antiphon"></div>

  <p class="loth-psalm-tone-label">Psalm tone</p>
  <div class="loth-score loth-psalm-tone" data-loth-score data-score-id="compline-scored-score-7" data-gabc="name:compline-scored-score-7;&#10;%%&#10;(c3) (g) (h) (ir0) (h) (i) (jr1) (iR) (:) (ir0) (jr1) (iR) (hr1) (g)" data-language="english" data-melody-id="en/sample/gospel-antiphon"></div>

  <div class="loth-score" data-loth-score data-score-id="compline-scored-score-8" data-gabc="name:compline-scored-score-8;&#10;%%&#10;(c4) &lt;sp&gt;V/&lt;/sp&gt;Sam(f)ple(g) ac(f)cla(e)ma(f)tion.(f) (::) (Z)&#10;&lt;sp&gt;R/&lt;/sp&gt;Sam(f)ple(g) re(f)sponse(e) to(f) it.(f) (::)" data-language="english" data-melody-id="en/sample/acclamation"></div>

  <h2 class="loth-section-heading">MARIAN ANTIPHON</h2>
</article>
</body>
</html>
